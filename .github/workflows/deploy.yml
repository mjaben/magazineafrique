name: Deploy Magazine Afrique Theme to Shared Hosting

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🚀 Sync files to cPanel wp-content/themes
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps # or sftp depending on your host
          local-dir: magazineafrique-theme/
          server-dir: public_html/wp-content/themes/magazineafrique-theme/
          dangerous-clean-slate: false
